<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2ea36a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="计划表">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>减脂 · 备考 计划表</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><h1>减脂 · 备考 计划表</h1></div>
    <div class="topdate" id="topdate"></div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap" id="tabs">
    <button data-tab="today" class="active">今日</button>
    <button data-tab="week">周计划</button>
    <button data-tab="train">训练</button>
    <button data-tab="timer">计时</button>
    <button data-tab="records">记录</button>
    <button data-tab="review">复盘</button>
    <button data-tab="reminder">提醒</button>
  </div>
</nav>

<main class="wrap" id="view"></main>

<footer class="footbar">
  <div class="wrap">
    <span>数据只保存在这台设备的浏览器里</span>
    <span class="row">
      <button class="btn sm" data-action="export-json">导出备份</button>
      <button class="btn sm" data-action="import-json">导入备份</button>
      <button class="btn sm" data-action="export-csv">导出 CSV</button>
      <button class="btn sm" data-action="print">打印</button>
    </span>
  </div>
</footer>

<input type="file" id="fileinput" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
